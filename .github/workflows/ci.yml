name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners top out at Xcode 26.x (Swift 6.3), so install the
      # swift.org 6.4 toolchain and select it via TOOLCHAINS.
      - name: Install Swift 6.4
        run: |
          curl -fsSLo "$RUNNER_TEMP/swift.pkg" \
            https://download.swift.org/swift-6.4.0-release/xcode/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-osx.pkg
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          TC=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" \
            /Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain/Info.plist)
          echo "TOOLCHAINS=$TC" >> "$GITHUB_ENV"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Validate Desktop Extension manifest
        run: npx --yes @anthropic-ai/mcpb validate mcpb/manifest.json
